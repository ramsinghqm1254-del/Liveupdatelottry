<style>
:root{--bg:#fff8ef;--card:#fff;--tx:#2b1a05;--mu:#7a6650;--ac:#f28c0f;--bd:#f0dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1409;--card:#271c0d;--tx:#f8ead6;--mu:#c2ab8b;--bd:#4a3720}}
:root[data-theme="dark"]{--bg:#1b1409;--card:#271c0d;--tx:#f8ead6;--mu:#c2ab8b;--bd:#4a3720}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:var(--ac);color:#fff;padding:14px 16px;text-align:center}
header h1{margin:6px 0 0;font-size:1.3rem}
.lg{display:block;margin:0 auto;height:44px;max-width:100%;background:#fff;border-radius:22px;padding:4px 8px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
.pg{display:none}.pg.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:0 0 14px}
.warn{border-left:5px solid var(--ac);font-size:.9rem}
h2{margin:0 0 4px}
.mu{color:var(--mu);font-size:.88rem}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:600;font-size:.85rem}
td.n{font-weight:700;letter-spacing:.05em;word-break:break-word}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input:first-child{flex:0 0 38%}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
footer{text-align:center;padding:16px;color:var(--mu);font-size:.8rem}
footer a{color:var(--mu)}
#msg{margin-top:10px;font-size:.9rem}
</style>
</head>

var S=JSON.parse(document.getElementById("state").textContent),A=JSON.parse(document.getElementById("auth").textContent);
var $=function(i){return document.getElementById(i)};
function renderResult(){

function addRow(p,n){
  var d=document.createElement("div");d.className="row";
  var a=document.createElement("input"),b=document.createElement("input"),x=document.createElement("button");
  a.value=p||"";a.placeholder="Prize";b.value=n||"";b.placeholder="Ticket no.";

  if(H(A.s+u)===A.u&&H(A.s+p)===A.p){

    $("login").style.display="none";$("panel").style.display="block";fillForm();
    $("save").textContent=canPub?"Save & Publish":"Download updated file";
    $("how").textContent=canPub?"Edit the result and press Save. The page updates for all visitors.":"Edit the result and download the updated file. Upload it to your hosting to update the live site.";
  }else{
    fails++;
    if(fails>=3){lock=Date.now()+30000;fails=0;$("lmsg").textContent="Too many attempts. Wait 30 seconds."}
    else $("lmsg").textContent="Wrong username or password."
  }
}
